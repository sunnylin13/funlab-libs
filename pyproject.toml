[project]
name = "funlab-libs"
version = "0.3.8"
description = "Some core libraries for funlab-flaskr."
authors = [{ name = "SunnyLin", email = "013.lin@gmail.com" }]
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "colorama>=0.4.6,<0.5",
    "sqlalchemy>=2.0.43,<3",
    "cryptography>=42.0.7,<43",
    "pandas>=2.2.2,<3",
    "flask-caching>=2.3.0,<3",
]

[project.urls]
Repository = "https://github.com/sunnylin13/funlab-libs"

[dependency-groups]
dev = ["pytest>=8.3.0,<10"]
docs = [
    "mkdocstrings-python>=1.8.0,<2",
    "mkdocs-material>=9.5.10,<10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# PEP 420 namespace package: top-level 'funlab' has no __init__.py;
# several repos contribute disjoint sub-packages to this namespace.
packages = ["funlab"]
